<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="128" fill="#090D16"/>
  
  <!-- Subtle architectural grid guidelines -->
  <line x1="96" y1="160" x2="416" y2="160" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 8"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 8"/>
  <line x1="96" y1="352" x2="416" y2="352" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 8"/>
  
  <!-- Minimalist fountain pen nib / handwriting stroke symbolizing 'U' for Unintently -->
  <defs>
    <linearGradient id="nibGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Fluid cursive loop forming a minimalist 'U' flourish -->
  <path d="M 140 180 C 140 320, 160 380, 256 380 C 352 380, 372 320, 372 180" 
        fill="none" 
        stroke="url(#strokeGradient)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Precision pen nib apex inside the loop -->
  <path d="M 256 190 L 286 250 L 256 295 L 226 250 Z" 
        fill="url(#nibGradient)"/>
  <circle cx="256" cy="255" r="5" fill="#090D16"/>
  <line x1="256" y1="260" x2="256" y2="295" stroke="#090D16" stroke-width="3"/>
</svg>
