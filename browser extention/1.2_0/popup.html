<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unintently - ChatGPT to Assignment</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <header class="popup-header">
        <div class="brand-row">
          <div class="brand-badge-icon">
            <img src="logo.png" width="28" height="28" alt="Unintently" style="border-radius: 6px; display: block;" />
          </div>
          <div class="brand-info">
            <div class="brand-name">Unintently <span class="v-tag">v2</span></div>
            <div class="brand-sub">ChatGPT to Assignment Sync</div>
          </div>
          <button id="btn-toggle-settings" class="icon-btn" title="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.869a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>

        <!-- Collapsible Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
          <label class="settings-label" for="worker-url-input">Cloudflare Worker Sync URL</label>
          <div class="settings-input-group">
            <input type="text" id="worker-url-input" class="settings-input" placeholder="http://localhost:8787 or https://worker.dev" />
            <button id="btn-save-settings" class="btn-save">Save</button>
          </div>
          <div id="settings-status" class="settings-status"></div>
        </div>
      </header>

      <!-- Main History Content -->
      <main class="popup-body">
        <div class="section-title-row">
          <span class="section-title">Saved Assignments</span>
          <span id="assignment-count-badge" class="count-badge">0</span>
        </div>

        <div id="assignments-list" class="assignments-list">
          <!-- Rendered dynamically -->
        </div>

        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
            </svg>
          </div>
          <div class="empty-title">No assignments saved yet</div>
          <div class="empty-desc">
            Open any conversation on ChatGPT and click the <strong>"Convert To Assignment"</strong> button near the prompt bar.
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="popup-footer">
        <button id="btn-clear-all" class="btn-secondary" title="Clear all local history">
          Clear History
        </button>
      </footer>

      <!-- QR Viewer Modal within Popup -->
      <div id="popup-qr-modal" class="popup-qr-modal hidden">
        <div class="popup-qr-card">
          <div class="popup-qr-header">
            <div id="popup-modal-title" class="popup-modal-title">Assignment QR</div>
            <button id="btn-close-qr-modal" class="icon-btn-close">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div class="popup-qr-canvas-wrapper">
            <canvas id="popup-qr-canvas" width="200" height="200"></canvas>
          </div>
          <div id="popup-qr-code-text" class="popup-qr-code-text"></div>
          <div class="popup-modal-actions">
            <button id="btn-modal-copy-code" class="btn-primary-small">Copy Code</button>
            <button id="btn-modal-copy-json" class="btn-secondary-small">Copy JSON</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="qr-generator.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
